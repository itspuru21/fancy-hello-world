server {
    listen 80;
    server_name localhost;

    # Where Nginx looks for your compiled Vite files
    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------
    # BLOCK 1: The API Reverse Proxy
    # ----------------------------------------------------
    # If the URL starts with /api/, Nginx stops looking for files 
    # and forwards the request to the Node.js container.
    location /api/ {
        # 'api-server' is the service name we define in docker-compose.yml
        # '3000' is the port the Node server listens on internally
        proxy_pass http://api-server:3000;
        
        # These headers pass the user's original IP and info to Node, 
        # otherwise Node thinks every request comes from Nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------
    # BLOCK 2: The Vite SPA Fallback
    # ----------------------------------------------------
    # For all other URLs (like /home or /about), Nginx tries to find 
    # the exact file. If it can't, it serves index.html so Vite's 
    # client-side router can handle the page change.
    location / {
        try_files $uri $uri/ /index.html;
    }
}